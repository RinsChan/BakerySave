<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Under Construction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            background: #f5f5f5;
            overflow: hidden;
        }

        /* Background */
        .background {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(
                    135deg,
                    rgba(255, 193, 7, 0.08) 25%,
                    transparent 25%
                ),
                linear-gradient(
                    315deg,
                    rgba(255, 193, 7, 0.08) 25%,
                    transparent 25%
                );
            background-size: 60px 60px;
            animation: moveBackground 10s linear infinite;
        }

        @keyframes moveBackground {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 120px 120px;
            }
        }

        .container {
            width: min(90%, 600px);
            padding: 50px 35px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        .icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 60px;

            background: #ffc107;
            border-radius: 50%;

            box-shadow:
                0 10px 30px rgba(255, 193, 7, 0.3);

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: clamp(32px, 6vw, 48px);
            margin-bottom: 15px;
            color: #222;
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #e9e9e9;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress {
            width: 65%;
            height: 100%;
            border-radius: inherit;
            background: #ffc107;
            animation: progress 2s ease-out;
        }

        @keyframes progress {
            from {
                width: 0;
            }

            to {
                width: 65%;
            }
        }

        .progress-text {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }

        .notice {
            padding: 15px 20px;
            background: #fff8e1;
            border-left: 4px solid #ffc107;
            border-radius: 6px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #aaa;
        }

        @media (max-width: 500px) {
            .container {
                padding: 40px 25px;
            }

            .icon {
                width: 90px;
                height: 90px;
                font-size: 48px;
            }

            .subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <main class="container">

        <div class="icon">
            🚧
        </div>

        <h1>Under Construction</h1>

        <p class="subtitle">
            We're currently working on something awesome.
            <br>
            Please check back soon!
        </p>

        <div class="progress-container">
            <div class="progress"></div>
        </div>

        <div class="progress-text">
            Development in progress — 65%
        </div>

        <div class="notice">
            🔧 We're making some improvements to bring you
            a better experience.
        </div>

        <footer>
            &copy; 2026 Your Website. All rights reserved.
        </footer>

    </main>

</body>
</html>
